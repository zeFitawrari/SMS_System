input RegisterStudentInput {
  registration_type: String
  student_id: uuid
  school_id: uuid
  branch_id: uuid
  academic_year_id: uuid!
  grade_level_id: uuid!
  section_id: uuid
  enrollment_date: date
  email: String
  phone: String
  first_name: String
  middle_name: String
  last_name: String
  date_of_birth: date
  sex: String
  guardians: [RegisterStudentGuardianInput!]
  health: RegisterStudentHealthInput
  address: RegisterStudentAddressInput
  payment: RegisterStudentPaymentInput!
