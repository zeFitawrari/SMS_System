enum RoleAssignmentScope {
  SCHOOL
  BRANCH
}

type Query {
  ListMySessions(object: ListMySessionsInput): ListMySessionsOutput
  ListMyContexts: ListMyContextsOutput
  GetRegistrationPaymentQuote(object: RegistrationPaymentQuoteInput!): RegistrationPaymentQuoteOutput
}

type Mutation {
  RegisterSchool(
    object: RegisterSchoolInput!
  ): RegisterSchoolOutput

  Login(object: LoginInput!): LoginOutput

  RefreshSession(object: RefreshSessionInput!): LoginOutput

  Logout(object: LogoutInput): LogoutOutput

  RevokeSession(object: RevokeSessionInput!): RevokeSessionOutput

  RevokeOtherSessions(object: RevokeOtherSessionsInput!): RevokeOtherSessionsOutput

  SelectContext(object: SelectContextInput!): SelectContextOutput

  AssignRole(object: AssignRoleInput!): AssignRoleOutput

  RevokeRoleAssignment(object: RevokeRoleAssignmentInput!): RevokeRoleAssignmentOutput

  RegisterStudent(object: RegisterStudentInput!): RegisterStudentOutput

  CreateStudentProfile(object: CreateStudentProfileInput!): CreateStudentProfileOutput
  SetStudentGuardians(object: SetStudentGuardiansInput!): SetStudentGuardiansOutput
  CompleteStudentRegistration(object: CompleteStudentRegistrationInput!): CompleteStudentRegistrationOutput

  ManageAcademicYear(object: ManageAcademicYearInput!): ManageAcademicYearOutput
  ManageGradeLevel(object: ManageGradeLevelInput!): ManageGradeLevelOutput
  ManageGradeMonthlyFee(object: ManageGradeMonthlyFeeInput!): ManageGradeMonthlyFeeOutput
  ManageSectionSlot(object: ManageSectionSlotInput!): ManageSectionSlotOutput
  ManageSchoolRegistrationPackage(object: ManageSchoolRegistrationPackageInput!): ManageSchoolRegistrationPackageOutput

  UpdateEnrollmentSection(object: UpdateEnrollmentSectionInput!): UpdateEnrollmentSectionOutput

  ManageUser(object: ManageUserInput!): ManageUserOutput
}

input RegisterSchoolInput {
  school_name: String!
  school_address: String
  latitude: Float
  longitude: Float
  main_branch_name: String
  admin_email: String!
  admin_phone: String!
  admin_password: String!
  admin_first_name: String!
  admin_last_name: String!
  owner_email: String
  owner_phone: String
  owner_password: String
  owner_first_name: String
  owner_last_name: String
}

input LoginInput {
  email: String
  phone: String
  password: String!
}

input RefreshSessionInput {
  session_token: String!
}

input LogoutInput {
  session_token: String
}

input ListMySessionsInput {
  current_session_id: uuid
  include_inactive: Boolean
}

input RevokeSessionInput {
  session_id: uuid!
}

input RevokeOtherSessionsInput {
  current_session_id: uuid!
}

type RegisterSchoolOutput {
  school_id: uuid!
  main_branch_id: uuid!
  admin_id: uuid!
  owner_id: uuid!
  access_token: String!
  token: String!
  session_id: uuid!
  session_token: String!
}

type LoginOutput {
  id: uuid!
  access_token: String!
  token: String!
  session_id: uuid!
  session_token: String!
  email: String
  phone: String
  first_name: String!
  last_name: String!
  school_id: uuid!
  roles: [String!]!
  active_role: String
  active_branch_id: uuid
}

type LogoutOutput {
  status: String!
  message: String!
}

type ListMySessionsOutput {
  sessions: [SessionSummary!]!
}

type SessionSummary {
  session_id: uuid!
  created_at: timestamptz!
  last_active_at: timestamptz!
  expires_at: timestamptz!
  revoked_at: timestamptz
  user_agent: String
  client_ip: String
  is_active: Boolean!
  is_current: Boolean!
}

type RevokeSessionOutput {
  status: String!
  message: String!
  revoked_session_id: uuid!
}

type RevokeOtherSessionsOutput {
  status: String!
  message: String!
  revoked_count: Int!
}

input SelectContextInput {
  role: String!
  branch_id: uuid
}

type SelectContextOutput {
  access_token: String!
  token: String!
  active_role: String!
  active_branch_id: uuid
  school_id: uuid!
  session_id: uuid!
  roles: [String!]!
}

type ListMyContextsOutput {
  contexts: [AuthContextOption!]!
}

type AuthContextOption {
  assignment_id: uuid!
  role: String!
  scope_type: String!
  branch_id: uuid
  branch_name: String
  branch_code: String
}

input AssignRoleInput {
  user_id: uuid!
  role: String!
  scope_type: RoleAssignmentScope!
  branch_id: uuid
}

type AssignRoleOutput {
  status: String!
  user_id: uuid!
  role: String!
  scope_type: String!
  branch_id: uuid
  school_id: uuid!
}

input RevokeRoleAssignmentInput {
  assignment_id: uuid!
}

type RevokeRoleAssignmentOutput {
  status: String!
  message: String!
  assignment_id: uuid!
  user_id: uuid!
}

