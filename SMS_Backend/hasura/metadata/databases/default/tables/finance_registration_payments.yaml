table:
  name: registration_payments
  schema: finance
configuration:
  custom_name: registration_payments
  custom_root_fields:
    select: registration_payments
    select_by_pk: registration_payment
object_relationships:
  - name: student
    using:
      foreign_key_constraint_on: student_id
select_permissions:
  - role: SUPER_PROVIDER_ADMIN
    permission:
      columns:
        - id
        - school_id
        - branch_id
        - student_id
        - enrollment_id
        - package_code
        - monthly_fee_snapshot
        - duration_months
        - discount_percent
        - base_amount
        - discount_amount
        - final_amount
        - payment_method
        - transfer_reference
        - payment_status
        - paid_on
        - package_starts_on
        - package_ends_on
        - created_at
      filter: {}
      allow_aggregations: true
  - role: SCHOOL_OWNER
    permission:
      columns:
        - id
        - student_id
        - enrollment_id
        - package_code
        - base_amount
        - discount_amount
        - final_amount
        - payment_method
        - transfer_reference
        - payment_status
        - paid_on
        - package_starts_on
        - package_ends_on
      filter:
        school_id:
          _eq: X-Hasura-School-Id
      allow_aggregations: true
  - role: SCHOOL_ADMIN
    permission:
      columns:
        - id
        - student_id
        - enrollment_id
        - package_code
        - base_amount
        - discount_amount
        - final_amount
        - payment_method
        - transfer_reference
        - payment_status
        - paid_on
      filter:
        school_id:
          _eq: X-Hasura-School-Id
      allow_aggregations: true
  - role: BRANCH_ADMIN
    permission:
      columns:
        - id
        - student_id
        - final_amount
        - payment_status
        - paid_on
        - payment_method
      filter:
        _and:
          - school_id:
              _eq: X-Hasura-School-Id
          - branch_id:
              _eq: X-Hasura-Branch-Id
      allow_aggregations: true
  - role: FINANCE
    permission:
      columns:
        - id
        - student_id
        - enrollment_id
        - package_code
        - monthly_fee_snapshot
        - duration_months
        - discount_percent
        - base_amount
        - discount_amount
        - final_amount
        - payment_method
        - transfer_reference
        - payment_status
        - paid_on
        - package_starts_on
        - package_ends_on
      filter:
        school_id:
          _eq: X-Hasura-School-Id
      allow_aggregations: true
