table:
  name: sections
  schema: academic
configuration:
  custom_name: sections
  custom_root_fields:
    select: sections
    select_by_pk: section
object_relationships:
  - name: slot
    using:
      foreign_key_constraint_on: slot_id
select_permissions:
  - role: SCHOOL_OWNER
    permission:
      columns:
        - id
        - school_id
        - branch_id
        - academic_year_id
        - grade_level_id
        - name
        - slot_id
        - max_capacity
      filter:
        school_id:
          _eq: X-Hasura-School-Id
  - role: SCHOOL_ADMIN
    permission:
      columns:
        - id
        - school_id
        - branch_id
        - academic_year_id
        - grade_level_id
        - name
        - slot_id
        - max_capacity
      filter:
        school_id:
          _eq: X-Hasura-School-Id
  - role: BRANCH_ADMIN
    permission:
      columns:
        - id
        - branch_id
        - academic_year_id
        - grade_level_id
        - name
        - slot_id
        - max_capacity
      filter:
        _and:
          - school_id:
              _eq: X-Hasura-School-Id
          - branch_id:
              _eq: X-Hasura-Branch-Id
  - role: RECEPTIONIST
    permission:
      columns:
        - id
        - branch_id
        - academic_year_id
        - grade_level_id
        - name
        - slot_id
        - max_capacity
      filter:
        school_id:
          _eq: X-Hasura-School-Id
