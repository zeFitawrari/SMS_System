table:
  name: student_addresses
  schema: student
configuration:
  custom_name: student_addresses
  custom_root_fields:
    select: student_addresses
object_relationships:
  - name: student
    using:
      foreign_key_constraint_on: student_id
select_permissions:
  - role: SCHOOL_OWNER
    permission:
      columns:
        - student_id
        - label
        - address_line
        - latitude
        - longitude
      filter:
        student:
          school_id:
            _eq: X-Hasura-School-Id
  - role: SCHOOL_ADMIN
    permission:
      columns:
        - student_id
        - label
        - address_line
        - latitude
        - longitude
      filter:
        student:
          school_id:
            _eq: X-Hasura-School-Id
  - role: BRANCH_ADMIN
    permission:
      columns:
        - student_id
        - label
        - address_line
        - latitude
        - longitude
      filter:
        student:
          _and:
            - school_id:
                _eq: X-Hasura-School-Id
            - branch_id:
                _eq: X-Hasura-Branch-Id
