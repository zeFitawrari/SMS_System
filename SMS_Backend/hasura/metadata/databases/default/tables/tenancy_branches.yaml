table:
  name: branches
  schema: tenancy
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: branches
  custom_root_fields:
    select: branches
    select_by_pk: branch
    select_aggregate: branches_aggregate
    insert: insert_branches
    insert_one: insert_branch
    update: update_branches
    update_by_pk: update_branch
    delete: delete_branches
    delete_by_pk: delete_branch
object_relationships:
  - name: school
    using:
      foreign_key_constraint_on: school_id
select_permissions:
  - role: SCHOOL_OWNER
    permission:
      columns:
        - id
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - created_at
        - updated_at
        - closed_at
      filter:
        school_id:
          _eq: X-Hasura-School-Id
      allow_aggregations: true
  - role: SCHOOL_ADMIN
    permission:
      columns:
        - id
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - created_at
        - updated_at
        - closed_at
      filter:
        school_id:
          _eq: X-Hasura-School-Id
      allow_aggregations: true
  - role: BRANCH_ADMIN
    permission:
      columns:
        - id
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - created_at
        - updated_at
        - closed_at
      filter:
        _and:
          - school_id:
              _eq: X-Hasura-School-Id
          - id:
              _eq: X-Hasura-Branch-Id
  - role: SUPER_PROVIDER_ADMIN
    permission:
      columns:
        - id
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - created_at
        - updated_at
        - closed_at
      filter: {}
      allow_aggregations: true
  - role: PROVIDER_ADMIN
    permission:
      columns:
        - id
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - created_at
        - updated_at
        - closed_at
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: SUPER_PROVIDER_ADMIN
    permission:
      check: {}
      columns:
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - closed_at
  - role: PROVIDER_ADMIN
    permission:
      check: {}
      columns:
        - school_id
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - closed_at
update_permissions:
  - role: SUPER_PROVIDER_ADMIN
    permission:
      columns:
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - closed_at
      filter: {}
      check: {}
  - role: PROVIDER_ADMIN
    permission:
      columns:
        - code
        - name
        - status
        - is_main
        - address
        - latitude
        - longitude
        - timezone
        - closed_at
      filter: {}
      check: {}
delete_permissions:
